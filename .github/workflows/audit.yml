name: Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      # GHSA-vfj7-8cjw-p6xm is in braces, a transitive dependency of
      # semantic-release that only runs at release time. No fixed version
      # exists yet; drop the ignore once one does.
      - run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm
